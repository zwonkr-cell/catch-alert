name: Catch Job Alert

# ─────────────────────────────────────────────────────────────
# 캐치 채용공고를 확인해 새 공고가 있으면 텔레그램으로 알립니다.
# 상태(seen_ids.json, bot_state.json)는 실행 후 리포지토리에 커밋해 다음 실행이 이어받습니다.
#
# 주 트리거: 외부 스케줄러(구글 Apps Script github_dispatcher.gs 또는 cron-job.org)가
#           workflow_dispatch 로 10분마다 호출합니다 → TRIGGER_SETUP.md
#   GitHub 의 schedule 은 혼잡하면 크게 지연·누락됩니다(실측 2026-10-22~11-04: 하루 예약 35회 중
#   약 6회만 실행, 주간 실행 간격 중앙값 약 5시간). 아래 schedule 은 외부 트리거가 멈췄을 때의 안전망.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # 혼잡한 정각·30분을 피해 22분·52분에 예약(안전망)
    - cron: "22,52 21-23 * * *"   # UTC 21~23시 = KST 06:22~08:52
    - cron: "22,52 0-11 * * *"    # UTC 00~11시 = KST 09:22~20:52
    - cron: "47 12-20/2 * * *"    # UTC 12,14,16,18,20시 = KST 21:47, 23:47, 01:47, 03:47, 05:47
  workflow_dispatch:          # 수동 실행 버튼(테스트용) + 외부 트리거
    inputs:
      mode:
        description: "실행 모드"
        required: false
        default: "run"
        type: choice
        options: [run, test, dry-run]

# seen_ids.json 을 push 하려면 쓰기 권한 필요
permissions:
  contents: write

# 실행이 겹치지 않게 브랜치별로 직렬화(중복 알림·상태파일 push 충돌 방지). 대기 중인 실행은 가장 최근 1건만 남습니다.
concurrency:
  group: catch-alert-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 멈춘 실행이 다음 실행을 막지 않도록(기본값은 6시간)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 실행이 만들어진 시점이 아니라 '지금' 브랜치 최신 커밋을 받음 → 앞 실행이 저장한 seen_ids 를 이어받아
          # 대기했다가 시작한 실행이 방금 보낸 공고를 다시 보내지 않음
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          # api_url 은 config.json 에 있어 별도 시크릿이 필요 없습니다(민감정보 아님).
          # API_URL: ${{ secrets.API_URL }}
          MODE: ${{ github.event.inputs.mode }}
        # exec: 시간 초과로 취소될 때 러너의 중단 신호가 파이썬에 바로 전달돼 상태 저장(finally)이 실행됨
        run: |
          if [ "$MODE" = "test" ]; then
            exec python catch_alert.py --test
          elif [ "$MODE" = "dry-run" ]; then
            exec python catch_alert.py --dry-run
          else
            exec python catch_alert.py
          fi

      - name: Persist state (seen_ids.json, bot_state.json)
        # 스크립트가 도중에 실패해도 상태(보낸 공고·하트비트·오류 타임스탬프) 저장. 미리보기는 저장 안 함
        if: always() && github.event.inputs.mode != 'dry-run'
        run: |
          if [ -n "$(git status --porcelain seen_ids.json bot_state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_ids.json bot_state.json
            git commit -m "chore: update state [skip ci]"
            for i in 1 2 3; do
              git push && exit 0
              echo "push 실패 → 최신 커밋을 받아 다시 시도 ($i/3)"
              git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || { git rebase --abort 2>/dev/null || true; sleep 3; }
            done
            git push
          else
            echo "상태 변경 없음 - 커밋 생략"
          fi
